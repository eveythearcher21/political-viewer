<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Res US Election Map Workbench</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px;
            background: #1e293b;
            text-align: center;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.8rem; }
        p { margin: 0; color: #38bdf8; font-size: 0.95rem; }
        
        #map-container {
            width: 95%;
            max-width: 960px;
            margin: 30px auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        /* SVG layer wrapper styles */
        svg {
            width: 100%;
            height: auto;
            max-height: 600px;
        }

        /* Styling applied dynamically to high-resolution geographic vector paths */
        path {
            fill: #475569;
            stroke: #1e293b;
            stroke-width: 1px;
            cursor: pointer;
            transition: fill 0.1s ease, stroke 0.1s ease;
        }
        path:hover {
            fill: #f59e0b !important;
            stroke: #ffffff;
            stroke-width: 1.5px;
        }

        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        
        .instructions {
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>US Election Map Canvas</h1>
        <p>High-Resolution Public Map Configuration • Single-File Implementation</p>
    </header>

    <div id="map-container">
        <div id="tooltip" class="tooltip"></div>
        
        <!-- Target container element where the detailed geographic SVG is injected -->
        <div id="svg-injection-point"></div>
        
        <div class="instructions">
            🖱️ Click any state to change alignment: Gray (Neutral) → Blue (Dem) → Red (Rep)
        </div>
    </div>

<script>
    const tooltip = document.getElementById('tooltip');
    const container = document.getElementById('map-container');
    const injectionPoint = document.getElementById('svg-injection-point');

    // High-resolution, official blank US Albers SVG vector base (Free public asset cloud)
    const officialSvgUrl = "https://githubusercontent.com";

    // Safely pull the detailed map data via background network streaming
    fetch(officialSvgUrl)
        .then(response => {
            if (!response.ok) throw new Error("Network network layer down");
            return response.text();
        })
        .then(svgData => {
            // Inject the detailed raw shapes cleanly into our viewer panel 
            injectionPoint.innerHTML = svgData;
            
            // Query all path layers inside the newly added SVG file
            const paths = injectionPoint.querySelectorAll('path');
            
            paths.forEach(path => {
                // Read identifying tags inside the asset source code (id or class attributes)
                const stateName = path.getAttribute('name') || path.getAttribute('id') || "US Region";
                
                // Establish background neutral color states safely
                path.style.fill = "#475569";
                path.style.stroke = "#1e293b";

                // 1. Tooltip Hover Interfaces
                path.addEventListener('mouseover', () => {
                    tooltip.style.opacity = '1';
                    tooltip.innerHTML = `<strong>${stateName}</strong>`;
                });

                path.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
                    tooltip.style.top = (e.clientY - rect.top - 15) + 'px';
                });

                path.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = '0';
                });

                // 2. Interactive Click Color Flipping Loop Mechanics
                path.addEventListener('click', () => {
                    const currentColor = path.style.fill;
                    
                    if (currentColor === 'rgb(71, 85, 105)' || currentColor === '#475569') {
                        path.style.fill = '#3b82f6'; // Dem Blue
                    } else if (currentColor === 'rgb(59, 130, 246)' || currentColor === '#3b82f6') {
                        path.style.fill = '#ef4444'; // Rep Red
                    } else {
                        path.style.fill = '#475569'; // Reset Gray
                    }
                });
            });
        })
        .catch(err => {
            console.error("Layout initialization fault error logic details:", err);
            injectionPoint.innerHTML = `<div style="text-align:center; padding:40px; color:#ef4444;">
                ⚠️ Critical Layout Initialization Error. Please check repository file connections.
            </div>`;
        });
</script>

</body>
</html>
