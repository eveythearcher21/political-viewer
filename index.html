<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Interactive US Map Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px;
            background: #1e293b;
            text-align: center;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.8rem; }
        p { margin: 0; color: #38bdf8; font-size: 0.95rem; }
        
        #map-container {
            width: 95%;
            max-width: 960px;
            margin: 30px auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            position: relative;
        }
        svg {
            width: 100%;
            height: auto;
        }
        .state-path {
            fill: #475569;
            stroke: #1e293b;
            stroke-width: 1px;
            cursor: pointer;
            transition: fill 0.1s ease;
        }
        .state-path:hover {
            fill: #f59e0b !important;
            stroke: #ffffff;
            stroke-width: 1.5px;
        }
        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .instructions {
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
    <!-- Import the localized coordinate database we created -->
    <script src="states-data.js"></script>
</head>
<body>

    <header>
        <h1>US Election Map Workbench</h1>
        <p>High-Resolution Isolated Framework Bundle</p>
    </header>

    <div id="map-container">
        <div id="tooltip" class="tooltip"></div>
        
        <!-- Interactive target graphic frame viewport layout -->
        <svg id="us-canvas" viewBox="0 0 959 593"></svg>
        
        <div class="instructions">
            鼠标 🖱️ Click any state to shift color alignments: Gray → Blue → Red
        </div>
    </div>

<script>
    const canvas = document.getElementById('us-canvas');
    const tooltip = document.getElementById('tooltip');
    const container = document.getElementById('map-container');

    // Dynamically iterate through the local coordinate database asset matrix strings
    Object.keys(US_MAP_GEOMETRY).forEach(stateId => {
        const pathData = US_MAP_GEOMETRY[stateId];
        const stateName = US_STATE_NAMES[stateId] || "US Region";

        // Construct individual interactive vector shapes natively into the viewport layer
        const pathEl = document.createElementNS("http://w3.org", "path");
        pathEl.setAttribute("d", pathData);
        pathEl.setAttribute("class", "state-path");
        pathEl.setAttribute("id", stateId);

        // Tooltip listeners
        pathEl.addEventListener('mouseover', () => {
            tooltip.style.opacity = '1';
            tooltip.innerHTML = `<strong>${stateName}</strong>`;
        });

        pathEl.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
            tooltip.style.top = (e.clientY - rect.top - 15) + 'px';
        });

        pathEl.addEventListener('mouseleave', () => {
            tooltip.style.opacity = '0';
        });

        // Click handler toggles selection colors 
        pathEl.addEventListener('click', () => {
            const currentFill = window.getComputedStyle(pathEl).fill;
            
            if (currentFill === 'rgb(71, 85, 105)') { 
                pathEl.style.fill = '#3b82f6'; // Dem Blue
            } else if (currentFill === 'rgb(59, 130, 246)') {
                pathEl.style.fill = '#ef4444'; // Rep Red
            } else {
                pathEl.style.fill = '#475569'; // Reset Gray
            }
        });

        canvas.appendChild(pathEl);
    });
</script>

</body>
</html>
